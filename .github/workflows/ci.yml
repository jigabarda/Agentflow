name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Mirrors the local commands in PLAN.md. Live agent/GitHub smoke tests are NOT
# part of PR CI — they need real credentials and spend tokens (see docs/TESTING.md).
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      SECRETS_ENC_KEY: "Q0lfb25seV9wbGFjZWhvbGRlcl9uZXZlcl9hX3JlYWxfa2V5MDA="

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm --workspace web run build

      # Playwright is added to CI in Phase 2, when there is a UI worth driving.
